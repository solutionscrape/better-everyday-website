# Downloads publisher logos for the "As seen in" ticker and commits them to the branch it runs on.
# Runs automatically when placement data changes (e.g. after `npm run import-placements`),
# or by hand from GitHub → Actions → "Fetch press logos" → Run workflow.
# Its own commit only touches logo files, so it does not trigger itself again.
name: Fetch press logos

on:
  push:
    paths:
      - 'src/data/placements/**'
      - 'scripts/fetch-press-logos.mjs'
      - '.github/workflows/fetch-press-logos.yml'
  workflow_dispatch:
    inputs:
      refetch:
        description: Re-download every logo (not just missing ones)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-press-logos -- ${{ inputs.refetch && '--all' || '' }}
        env:
          FORCE_COLOR: '0'
      - name: Save logos as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: press-logos
          path: |
            public/img/press
            src/data/press-logos.json
      - name: Print logos into the log
        # For environments that can read job logs but not artifacts. Decode the lines between
        # the markers with `base64 -d | tar xz`.
        run: |
          tar czf - public/img/press src/data/press-logos.json | base64 -w 76 > logos.b64
          echo "sha256 $(base64 -d logos.b64 | sha256sum)"
          echo "----- BEGIN PRESS LOGOS -----"
          cat logos.b64
          echo "----- END PRESS LOGOS -----"
      - name: Commit logos
        # Some repository rules block bot pushes; the artifact above is the fallback.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/press src/data/press-logos.json
          if git diff --cached --quiet; then echo "No new logos."; exit 0; fi
          git commit -m "Update press logos for the As seen in ticker"
          git push
